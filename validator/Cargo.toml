[package]
name = "aether-validator"
version = "0.1.0"
edition = "2021"

[dependencies]
aether-core = { path = "../core" }
tokio = { version = "1.0", features = ["full"] }
libp2p = { version = "0.53", features = ["tokio", "dns", "tcp", "websocket", "noise", "yamux", "gossipsub", "request-response", "mdns"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.10"
anyhow = "1.0"
clap = { version = "4.0", features = ["derive"] }
