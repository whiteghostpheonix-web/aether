[package]
name = "aether"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
sha2 = "0.10"
hex = "0.4"
log = "0.4"
env_logger = "0.10"
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
chrono = "0.4"
rand = "0.8"

# P2P Networking
libp2p = { version = "0.53", features = ["tokio", "dns", "tcp", "websocket", "noise", "yamux", "gossipsub", "request-response", "mdns"] }

# Storage
rocksdb = "0.21"

# Async
futures = "0.3"
